version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Streamlit Application Container (Backend Worker)
  # ----------------------------------------------------------------------------
  smart-attendance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kprit_smart_attendance
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      # Persistent storage for facial templates, SQLite database, and reports
      - ./data:/app/data
      - ./database:/app/database
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - SHOW_EVAL_CREDENTIALS=false
      - SESSION_TIMEOUT_MINUTES=30
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - attendance-internal

  # ----------------------------------------------------------------------------
  # 2. Nginx Reverse Proxy with TLS Termination & HTTP->HTTPS Redirect
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: kprit_attendance_nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (redirects permanently to HTTPS)
      - "443:443"   # HTTPS (SSL/TLS encrypted)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - smart-attendance
    networks:
      - attendance-internal

networks:
  attendance-internal:
    driver: bridge
